# /etc/nginx/conf.d/repo-scout-api.conf
# 部署说明：cp deploy/nginx-api.conf /etc/nginx/conf.d/repo-scout-api.conf
#           nginx -t && nginx -s reload
# Certbot 执行后会自动在 443 块补充 ssl_certificate / ssl_certificate_key 等行。
# 此文件不含任何密钥；INTERNAL_API_KEY 只存在于 VPS .env 与 Vercel 环境变量中。

# HTTP → HTTPS 重定向（Certbot ACME 验证例外）
server {
    listen 80;
    listen [::]:80;
    server_name api.repo-scout.chada010.me;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 反向代理（占位块；Certbot 执行后自动补充 ssl_certificate 等行）
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.repo-scout.chada010.me;

    # --- Certbot 执行后自动填充以下 SSL 行 ---
    # ssl_certificate     /etc/letsencrypt/live/api.repo-scout.chada010.me/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.repo-scout.chada010.me/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        # 索引与报告是同步长请求，不截断
        client_max_body_size 4m;
    }
}
