[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-scout-eval"
version = "0.4.0"
description = "repo-scout 黑盒评测工具:只通过公开 REST API 量化 RAG / Agent / 多轮污染 / 阈值曲线"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.6,<3",
    "PyYAML>=6.0,<7",
    "rich>=13.7,<15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1,<9",
    "respx>=0.21,<1",
    "ruff>=0.5,<1",
    "mypy>=1.9,<2",
    "types-PyYAML>=6.0,<7",
]

[project.scripts]
repo-scout-eval = "repo_scout_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
