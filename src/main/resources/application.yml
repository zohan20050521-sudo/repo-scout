spring:
  application:
    name: repo-scout
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:repo_scout}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

server:
  port: 8080

app:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
    model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
    timeout: ${DEEPSEEK_TIMEOUT:60s}
  chat:
    message-max-length: ${CHAT_MESSAGE_MAX_LENGTH:4000}
    memory:
      max-messages: ${CHAT_MEMORY_MAX_MESSAGES:20}
      ttl: ${CHAT_MEMORY_TTL:24h}
  github:
    base-url: ${GITHUB_BASE_URL:https://api.github.com}
    token: ${GITHUB_TOKEN:}
    timeout: ${GITHUB_TIMEOUT:10s}
  tools:
    tree-max-depth: 3
    tree-max-entries: 200
    readme-max-chars: 8000
    issues-max: 20
    commits-max: 20
  agent:
    max-tool-rounds: ${AGENT_MAX_TOOL_ROUNDS:5}
  rag:
    max-files: ${RAG_MAX_FILES:30}
    max-file-bytes: ${RAG_MAX_FILE_BYTES:100000}
    chunk-size: ${RAG_CHUNK_SIZE:400}
    chunk-overlap: ${RAG_CHUNK_OVERLAP:80}
